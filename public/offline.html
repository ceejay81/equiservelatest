<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline - EquiServe</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }
        .container {
            text-align: center;
            padding: 40px;
            max-width: 500px;
        }
        .icon {
            font-size: 80px;
            margin-bottom: 24px;
            opacity: 0.9;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 16px;
            font-weight: 700;
        }
        p {
            font-size: 18px;
            opacity: 0.9;
            line-height: 1.6;
            margin-bottom: 32px;
        }
        .btn {
            background: white;
            color: #667eea;
            padding: 14px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            display: inline-block;
            transition: transform 0.2s;
        }
        .btn:hover {
            transform: translateY(-2px);
        }
        .status {
            margin-top: 24px;
            padding: 12px 24px;
            background: rgba(255,255,255,0.2);
            border-radius: 8px;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="icon">📡</div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Don't worry, you can still access cached data and create sales offline.</p>
        <a href="/dashboard" class="btn">Go to Dashboard</a>
        <div class="status" id="status">
            Checking connection...
        </div>
    </div>

    <script>
        function checkConnection() {
            if (navigator.onLine) {
                document.getElementById('status').textContent = '✓ Connection restored!';
                setTimeout(() => {
                    window.location.href = '/dashboard';
                }, 1500);
            } else {
                document.getElementById('status').textContent = '✗ Still offline';
            }
        }

        setInterval(checkConnection, 3000);
        checkConnection();

        window.addEventListener('online', () => {
            document.getElementById('status').textContent = '✓ Back online!';
            setTimeout(() => window.location.href = '/dashboard', 1000);
        });
    </script>
</body>
</html>
